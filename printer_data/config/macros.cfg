[gcode_macro PRINT_START]
gcode:
  {% set target_bed = params.BED|int %}
  {% set target_extruder = params.EXTRUDER|int %}
  {% set target_chamber = params.CHAMBER|default("45")|int %}
  {% set initial_tool = params.TOOL|default("0")|int %}

   # Home the printer, set absolute positioning and update the Stealthburner LEDs.
  SET_DISPLAY_TEXT MSG="Homing"
  STATUS_HOMING                                         # Set LEDs to homing-mode
  SET_PIN PIN=caselight VALUE=1.0
  G28                                                   # Full home (XYZ)
  QUAD_GANTRY_LEVEL
  G90                                                   # Absolute position

  AFC_PARK
  _Initial_load BED={target_bed} EXTRUDER={target_extruder} TOOL={initial_tool}
  
  # Checks if a heat soak is required
  {% if target_chamber|int > 0 %}
    SET_DISPLAY_TEXT MSG="Bed: {target_bed}c"           # Displays info
    STATUS_HEATING                                      # Sets SB-leds to heating-mode
    M109 S150 # set extruder to standby to not ooze

    G1 X175 Y175 #go to center of bed

    #enable fans to ciculate the air
    M106 S255
    SET_FAN_SPEED FAN=Nevermore SPEED=1.0                 # Turns on the nevermore

    M190 S{target_bed}                                  # Sets the target temp for the bed and wait
    SET_DISPLAY_TEXT MSG="Heatsoak: {target_chamber}c"  # Displays info
    TEMPERATURE_WAIT SENSOR="temperature_sensor chamber_temp" MINIMUM={target_chamber}   # Waits for chamber to reach desired temp

  # If a heat soak is not required, then it skips the heatsoak and just heats up to set temp
  {% else %}
    SET_DISPLAY_TEXT MSG="Bed: {target_bed}c"           # Displays info
    STATUS_HEATING                                      # Sets SB-leds to heating-mode
    M190 S{target_bed}                                  # Sets the target temp for the bed and wait
  {% endif %}
  M106 S0 # Turns off the PT-fan
  M109 S150
  
  # Quad gantry level AKA QGL
  SET_DISPLAY_TEXT MSG="Leveling"                      # Display info on display
  STATUS_LEVELING     # Set LEDs to leveling-mode
  G28 Z  #home z after heating to reduce chance of colliding
  G1 X100 #avoid cut pin
  QUAD_GANTRY_LEVEL                                    # Level the printer via QGL
  G28 Z                                                # Home Z again after QGL

  
  # BED_MESH_PROFILE LOAD=default
  BED_MESH_CALIBRATE ADAPTIVE=1
  # Heats up the nozzle up to target via data from slicer
  SET_DISPLAY_TEXT MSG="Hotend: {target_extruder}c"             # Displays info
  STATUS_HEATING                                                # Sets SB-leds to heating-mode
  AFC_PARK
  M107                                                          # Turns off partcooling fan
  M109 S{target_extruder}                                       # Heats the nozzle to printing temp

  # Gets ready to print by doing a purge line and updating the SB-leds
  SET_DISPLAY_TEXT MSG="Printing..."          # Displays info
  STATUS_PRINTING # Sets SB-leds to printing-mode
  G1 X100 #avoid cut pin
  LINE_PURGE
  G90                                              # Absolute position

  


[gcode_macro _Initial_load]
gcode:
    {% set target_bed = params.BED|int %}
    {% set target_extruder = params.EXTRUDER|int %}
    {% set initial_tool = params.TOOL|default("0")|int %}
    {% set current_lane = printer.AFC.current_load %}
    
    # M118 current lane is {current_lane}
    {% if current_lane == None %}
      {% set current_map = -1 %}
      #M118 "No Lane loaded"
    {% else %}
      {% set current_map = printer["AFC_stepper "~current_lane].map %}
      # M118 map set
    {% endif %}
    
    # M118 Map is {current_map}
    STATUS_HEATING
    M140 S{target_bed} # Set bed temp
  
    # M118 current_map={current_map} tool={"T"~initial_tool}
    
    {% if current_map != "T"~initial_tool %}
      SET_DISPLAY_TEXT MSG="Hotend: {target_extruder}c"          # Displays info
      M109 S{target_extruder} # wait for extruder temp
      SET_DISPLAY_TEXT MSG="Loading Tool: T{initial_tool}"          # Displays info
      T{initial_tool} #Load Initial Tool
      M106 S255 # turn on pt fan to cool down
    {% endif %}
     
    M104 S150 # set standby extruder temp


[gcode_macro PRINT_END]
#   Use PRINT_END for the slicer ending script - please customise for your slicer of choice
gcode:
    # safe anti-stringing move coords
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [th.position.z + 2, th.axis_maximum.z]|min %}
    
    SAVE_GCODE_STATE NAME=STATE_PRINT_END

    SET_SKEW CLEAR=1


    TURN_OFF_HEATERS
    M400                           ; wait for buffer to clear

    {% if printer.extruder.temperature |int > 150 %}
      G92 E0                         ; zero the extruder
      G1 E-10 F800                 ; retract filament
    {% endif %}
    
    
    G90       
    G1 X100 Y300 F20000 #avoid cut pin
    AFC_PARK
    {% if printer.toolhead.position.z < 100 %}
      G0 Z100
    {% endif %}
    M107 # turn off fan
  

    STATUS_OFF
    SET_DISPLAY_TEXT
    SET_PIN PIN=caselight VALUE=0
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END
    UPDATE_DELAYED_GCODE ID=NEVERMORE_COOLDOWN DURATION=600

[delayed_gcode NEVERMORE_COOLDOWN]
gcode:
  SET_FAN_SPEED FAN=Nevermore SPEED=0 
  

[gcode_macro CANCEL_PRINT]
gcode: 
    PRINT_END
    CANCEL_PRINT_BASE

[gcode_macro QUAD_GANTRY_LEVEL]
rename_existing: BASE_QUAD_GANTRY_LEVEL
gcode:
    # Pass 1: Initial Coarse Leveling
    BASE_QUAD_GANTRY_LEVEL HORIZONTAL_MOVE_Z=10 RETRY_TOLERANCE=1
    # Pass 2: Fine Leveling and Accuracy
    BASE_QUAD_GANTRY_LEVEL HORIZONTAL_MOVE_Z=2

[gcode_macro DUMP_VARIABLES]
gcode:
    {% set filter_name = params.NAME|default('')|string|lower %}
    {% set filter_value = params.VALUE|default('')|string|lower %}
    {% set show_cfg = params.SHOW_CFG|default(0)|int %}
    
    {% set out = [] %}

    {% for key1 in printer %}
        {% for key2 in printer[key1] %}
            {% if (show_cfg or not (key1|lower == 'configfile' and key2|lower in ['config', 'settings'])) and (filter_name in key1|lower or filter_name in key2|lower) and filter_value in printer[key1][key2]|string|lower %}
                {% set dummy = out.append("printer['%s'].%s = %s" % (key1, key2, printer[key1][key2])) %}
            {% endif %}
        {% else %}
            {% if filter_name in key1|lower and filter_value in printer[key1]|string|lower %}
                {% set dummy = out.append("printer['%s'] = %s" % (key1, printer[key1])) %}
            {% endif %}
        {% endfor %}
    {% endfor %}
    
    {action_respond_info(out|join("\n"))}



